name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gradients:
    # The maths, with no dependencies at all: every hand-written backward pass
    # checked against numerical gradients, plus the physics and a short PPO run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/gradcheck.cjs

  browser:
    # Loads every lesson, trains each model and drives the controls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
